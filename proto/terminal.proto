syntax = "proto3";
import "google/protobuf/timestamp.proto";

package terminal;

service TerminalService {
  rpc Stream(stream TerminalCommand) returns (stream TerminalResponse);
}

message TerminalCommand {
  oneof command {
    ListRequest        list        = 1;
    CreateRequest      create      = 2;
    DestroyRequest     destroy     = 3;
    SubscribeRequest   subscribe   = 4;
    UnsubscribeRequest unsubscribe = 5;
    WriteRequest       write       = 6;
    ResizeRequest      resize      = 7;
    SetTitleRequest    set_title   = 8;
    RefreshRequest     refresh     = 9;
    ScrollbackRequest  scrollback  = 10;
  }
}

message ListRequest        {}
message CreateRequest      { uint32 cols = 1; uint32 rows = 2; optional string command = 3; }
message DestroyRequest     { string pty_id = 1; }
message SubscribeRequest   { string pty_id = 1; }
message UnsubscribeRequest { string pty_id = 1; }
message WriteRequest       { string pty_id = 1; bytes data = 2; }
message ResizeRequest      { string pty_id = 1; uint32 cols = 2; uint32 rows = 3; }
message SetTitleRequest    { string pty_id = 1; string title = 2; }
message RefreshRequest     { string pty_id = 1; }
message ScrollbackRequest {
  string pty_id     = 1;
  // Distance from the active-screen edge, in rows.
  // 0 = the row immediately above the active screen (most recent history).
  uint32 row_offset = 2;
  // Maximum number of scrollback rows to return. Must be > 0; 0 returns empty data.
  uint32 row_count  = 3;
}

message TerminalResponse {
  oneof response {
    ListResponse    list       = 1;
    CreateResponse  create     = 2;
    CommandResponse command    = 3;
    StreamData      stream     = 4;
    RefreshResponse refresh    = 5;
    StreamMetadata  metadata   = 6;
    ScrollbackResponse scrollback = 7;
  }
}

message PtyItem {
  string                    pty_id     = 1;
  string                    hostname   = 2;
  string                    pts_name   = 3;
  uint32                    cols       = 4;
  uint32                    rows       = 5;
  string                    title      = 6;
  bool                      subscribed = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListResponse    { repeated PtyItem items = 1; }
message CreateResponse  { PtyItem item = 1; }
message CommandResponse { string pty_id = 1; bool success = 2; optional string error = 3; }
message StreamData      { string pty_id = 1; uint64 generation = 2; bytes data = 3; }
message RefreshResponse {
  string pty_id     = 1;
  uint64 generation = 2;
  bytes  data       = 3;
  uint32 cursor_x   = 4;
  uint32 cursor_y   = 5;
}

message ScrollbackResponse {
  string pty_id                = 1;
  uint64 generation            = 2;
  bytes  data                  = 3;
  uint32 total_scrollback_rows = 4;
}

enum StreamMetadataReason {
  RESIZE              = 0;
  CLOSED              = 1;
  TITLE_CHANGED       = 2;
  SUBSCRIBERS_CHANGED = 3;
}

// NOTE: item.subscribed is always true — recipient is by definition subscribed.
// When PtyItem is split into PtyState + per-client fields, switch to PtyState.
message StreamMetadata {
  string               pty_id      = 1;
  PtyItem              item        = 2;
  StreamMetadataReason reason      = 3;
  optional int32       exit_code   = 4;
  uint64               generation  = 5;
}
