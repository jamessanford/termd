syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

package terminal;

service TerminalService {
  // ---- Control plane: unary CRUD over the same HTTP/2 connection ----
  // Failures are reported via gRPC status (NOT_FOUND, INVALID_ARGUMENT, ...),
  // not in-band success flags. Mutations return the resulting entity so the
  // caller sees the applied state without round-tripping through the stream.
  rpc List     (ListRequest)     returns (ListResponse);
  rpc Create   (CreateRequest)   returns (PtyItem);
  rpc Destroy  (DestroyRequest)  returns (google.protobuf.Empty);
  rpc Resize   (ResizeRequest)   returns (PtyItem);
  rpc SetTitle (SetTitleRequest) returns (PtyItem);

  // Refresh asks the daemon to emit the full screen snapshot.  The snapshot
  // itself will be placed into the Subscribe stream as SubscribeEvent.refresh.
  rpc Refresh (RefreshRequest) returns (google.protobuf.Empty);

  // Scrollback returns a viewport snapshot.  The rows come back here
  // rather than on the Subscribe stream, as scrollback is a different "mode".
  rpc Scrollback (ScrollbackRequest) returns (ScrollbackResponse);

  // Subscribe begins watching a PTY and streams the PTY as the response
  // until unsubscribe.  The first client frame must be SubscribeStart.
  rpc Subscribe (stream SubscribeFrame) returns (stream SubscribeEvent);
}

// ============================ Shared types ============================

// Size is the dimensions of a terminal PTY.  pixel dimensions for
// image protocols (sixel/kitty) can be added here later.
message Size { uint32 cols = 1; uint32 rows = 2; }

message PtyItem {
  uint64                    pty_id             = 1;
  string                    hostname           = 2;
  string                    pts_name           = 3;
  Size                      size               = 4;
  string                    title              = 5;
  google.protobuf.Timestamp created_at         = 6;
  repeated SubscriberInfo   subscribers        = 7;
  optional google.protobuf.Timestamp last_subscribed_at = 8;
  uint32                    sort_order         = 9;
}

message SubscriberInfo {
  string                    subscriber_id = 1;
  string                    hostname      = 2;
  Size                      size          = 3;
  google.protobuf.Timestamp created_at    = 4;
}

// ======================= Control plane messages =======================

message ListRequest    {}
message ListResponse   { repeated PtyItem items = 1; }

message CreateRequest  { Size size = 1; optional string command = 2; }
message DestroyRequest { uint64 pty_id = 1; }
message ResizeRequest  { uint64 pty_id = 1; Size size = 2; }
message SetTitleRequest{ uint64 pty_id = 1; string title = 2; }

message RefreshRequest { uint64 pty_id = 1; string subscriber_id = 2; }

enum ScrollbackOpKind {
  SCROLLBACK_OPEN  = 0;  // place pin at the live tail (row_offset 0); amount ignored
  SCROLLBACK_MOVE  = 1;  // move pin by `amount` rows; + = older/up, - = newer/down
  SCROLLBACK_CLOSE = 2;  // remove the pin; no rows returned
}

message ScrollbackRequest {
  uint64           pty_id        = 1;
  string           subscriber_id = 2;
  ScrollbackOpKind kind          = 3;
  uint32           row_count     = 4;  // viewport height in rows
  sint32           amount        = 5;  // MOVE only; + older/up, - newer/down
}

message ScrollbackResponse {
  bytes  data                  = 1;  // empty for CLOSE
  uint32 total_scrollback_rows = 2;
  uint32 row_offset            = 3;  // viewport bottom-edge distance from tail (0 = tail)
}

// ===================== Data plane: client -> server ====================

message SubscribeFrame {
  oneof frame {
    SubscribeStart start = 1;  // must be the first frame, exactly once
    WriteData      write = 2;  // bytes to the PTY; ordered w.r.t. the stream
  }
}

message SubscribeStart {
  uint64 pty_id   = 1;
  string hostname = 2;
  Size   size     = 3;
}

message WriteData { bytes data = 1; }

// ===================== Data plane: server -> client ====================

message SubscribeEvent {
  oneof event {
    SubscribeReady ready    = 1;  // first frame; carries the server-assigned id
    StreamData     data     = 2;  // live PTY output
    StreamMetadata metadata = 3;  // out-of-band state changes
    RefreshData    refresh  = 4;  // snapshot emitted in response to Refresh
  }
}

// SubscribeReady is the first event on every Subscribe stream.
message SubscribeReady { string subscriber_id = 1; }

message StreamData { bytes data = 1; }

message RefreshData {
  bytes data     = 1;
  Size  size     = 2;
  // True when the daemon was forced to snapshot mid-sequence by the refresh
  // stall timeout (the app went idle inside an escape sequence). Best-effort;
  // the client may request a clean refresh later. See docs/REFRESH.md.
  bool  degraded = 3;
}

// Out-of-band subscription state changes, ordered within the stream. Each
// variant carries exactly the payload its change implies.
message StreamMetadata {
  oneof event {
    Resized            resized             = 1;
    TitleChanged       title_changed       = 2;
    Exited             exited              = 3;
    SubscribersChanged subscribers_changed = 4;
    DataLost           data_lost           = 5;
  }
}

message Resized            { Size size = 1; }
message TitleChanged       { string title = 1; }
message Exited             { int32 exit_code = 1; }
message SubscribersChanged { repeated SubscriberInfo subscribers = 1; }

// DataLost means the subscriber lagged and stream data was potentially lost.
// The client should call Refresh to resynchronize.
message DataLost           {}
