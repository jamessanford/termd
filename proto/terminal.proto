syntax = "proto3";
import "google/protobuf/timestamp.proto";

package terminal;

service TerminalService {
  rpc Stream(stream TerminalCommand) returns (stream TerminalResponse);
}

message TerminalCommand {
  oneof command {
    ListRequest        list        = 1;
    CreateRequest      create      = 2;
    DestroyRequest     destroy     = 3;
    SubscribeRequest   subscribe   = 4;
    UnsubscribeRequest unsubscribe = 5;
    WriteRequest       write       = 6;
    ResizeRequest      resize      = 7;
    SetTitleRequest    set_title   = 8;
    RefreshRequest     refresh     = 9;
    ScrollbackRequest  scrollback  = 10;
  }
}

message ListRequest        {}
message CreateRequest      { uint32 cols = 1; uint32 rows = 2; optional string command = 3; }
message DestroyRequest     { uint64 pty_id = 1; }
message SubscribeRequest   { uint64 pty_id = 1; string hostname = 2; uint32 cols = 3; uint32 rows = 4; }
message UnsubscribeRequest { uint64 pty_id = 1; }
message WriteRequest       { uint64 pty_id = 1; bytes data = 2; }
message ResizeRequest      { uint64 pty_id = 1; uint32 cols = 2; uint32 rows = 3; }
message SetTitleRequest    { uint64 pty_id = 1; string title = 2; }
message RefreshRequest     { uint64 pty_id = 1; }
enum ScrollbackOp {
  SCROLLBACK_OP_OPEN  = 0;  // place pin at the live tail (row_offset 0); amount ignored
  SCROLLBACK_OP_MOVE  = 1;  // move pin by `amount` rows; + = older/up, - = newer/down
  SCROLLBACK_OP_CLOSE = 2;  // remove the pin; no data returned
}

message ScrollbackRequest {
  uint64       pty_id    = 1;
  reserved                 2;   // was row_offset
  // Viewport height in rows.
  uint32       row_count = 3;
  ScrollbackOp op        = 4;
  // MOVE only; signed row delta (+ older / up, - newer / down).
  sint32       amount    = 5;
}

message TerminalResponse {
  oneof response {
    ListResponse       list       = 1;
    CreateResponse     create     = 2;
    CommandResponse    command    = 3;
    StreamData         stream     = 4;
    RefreshResponse    refresh    = 5;
    StreamMetadata     metadata   = 6;
    ScrollbackResponse scrollback = 7;
    SubscribeResponse  subscribe  = 8;
  }
}

message PtyItem {
  uint64                    pty_id      = 1;
  string                    hostname    = 2;
  string                    pts_name    = 3;
  uint32                    cols        = 4;
  uint32                    rows        = 5;
  string                    title       = 6;
  reserved                                7;
  google.protobuf.Timestamp created_at        = 8;
  repeated SubscriberInfo   subscribers       = 9;
  optional google.protobuf.Timestamp last_subscribed_at = 10;
  uint32                    sort_order  = 11;
}

message ListResponse    { repeated PtyItem items = 1; }
message CreateResponse  { PtyItem item = 1; }
message CommandResponse { uint64 pty_id = 1; bool success = 2; optional string error = 3; }
message StreamData      { uint64 pty_id = 1; uint64 generation = 2; bytes data = 3; }
message RefreshResponse {
  uint64 pty_id     = 1;
  uint64 generation = 2;
  bytes  data       = 3;
  reserved            4;
  reserved            5;
  uint32 cols       = 6;
  uint32 rows       = 7;
  // True when the daemon was forced to snapshot mid-sequence by the refresh
  // stall timeout (the app went idle inside an escape sequence). The render is
  // best-effort and may resume a client on an orphaned sequence tail; the client
  // decides whether to request a clean refresh later. See docs/REFRESH.md.
  bool   degraded   = 8;
}

message ScrollbackResponse {
  uint64 pty_id                = 1;
  uint64 generation            = 2;
  bytes  data                  = 3;
  uint32 total_scrollback_rows = 4;
  // Viewport bottom-edge distance from the live tail (0 = tail).
  uint32 row_offset            = 5;
}

message SubscriberInfo {
  string                    subscriber_id = 1;
  string                    hostname      = 2;
  uint32                    cols          = 3;
  uint32                    rows          = 4;
  google.protobuf.Timestamp created_at    = 5;
}

message SubscribeResponse {
  uint64          pty_id        = 1;
  bool            success       = 2;
  optional string error         = 3;
  string          subscriber_id = 4;
}

enum StreamMetadataReason {
  RESIZE              = 0;
  CLOSED              = 1;
  TITLE_CHANGED       = 2;
  SUBSCRIBERS_CHANGED = 3;
}

message StreamMetadata {
  uint64               pty_id      = 1;
  PtyItem              item        = 2;
  StreamMetadataReason reason      = 3;
  optional int32       exit_code   = 4;
  uint64               generation  = 5;
}
